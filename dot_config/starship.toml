"$schema" = 'https://starship.rs/config-schema.json'
scan_timeout = 10
add_newline = false

format = """
[\u256d\u2500 ](fg:blue)\
$hostname\
$username\
$directory\
$golang\
$nodejs\
$rust\
$swift\
$git_branch
[\u2570\u2500 \u276f ](fg:blue)\
"""

[username]
show_always = true

[character]
success_symbol = '[➜](bold green)'

[aws]
symbol = " "

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[cpp]
symbol = " "

[cmake]
symbol = " "

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[deno]
symbol = " "

[directory]
read_only = " 󰌾"
style = "bold blue"
format = "[ $path]($style)[$read_only]($readonly_style) "
truncation_length = 1

[docker_context]
symbol = " "

[elixir]
symbol = " "

[elm]
